// 好友 id 只能是 friend_ 開頭的英數字：它會被拼進 localStorage 的鍵，
// 匯入的檔案也靠這條規則擋掉不屬於本工具的鍵。
const PROFILE_ID_RE = /^friend_[A-Za-z0-9_]{1,40}$/;
const MAX_NAME_LEN = 40;
const DEFAULT_PROFILES = [{ id: 'friend_default', name: '預設好友 / Default' }];

function cleanProfiles(list) {
    if (!Array.isArray(list)) return [];
    const seen = new Set();
    return list.filter(p => p && typeof p.id === 'string' && PROFILE_ID_RE.test(p.id) && !seen.has(p.id) && seen.add(p.id))
               .map(p => ({ id: p.id, name: String(p.name ?? '').trim().slice(0, MAX_NAME_LEN) || p.id }));
}

function loadProfiles() {
    try {
        const list = cleanProfiles(JSON.parse(localStorage.getItem('friendProfiles')));
        if (list.length) return list;
    } catch (e) { /* 壞掉的紀錄就當沒有 */ }
    return DEFAULT_PROFILES.map(p => ({ ...p }));
}

function readFlag(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'false') === true; }
    catch (e) { return false; }
}

function initApp() {
    const theme = localStorage.getItem('sky_tool_theme') || 'light';
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('langSelect').value = currentLang;
    
    document.getElementById('myCandles').value = localStorage.getItem('sky_my_candles') || 0;

    fetch('data/friend_tree.json')
    .then(resp => resp.json())
    .then(data => {
        rawJSONData = data;
        finalizeInit();
    }).catch(err => {
        const p = document.createElement('p');
        p.style.cssText = 'color:red; text-align:center;';
        p.textContent = uiDict[currentLang].loadFail;
        document.getElementById('treeContainer').replaceChildren(p);
    });
    renderChangelog();
    if (localStorage.getItem('sky_tool_changelog_collapsed') !== '0') {
        document.getElementById('changelog-body').classList.add('collapsed');
        document.getElementById('changelog-header').classList.add('collapsed');

}

// --- UI 客製化函式 (Modal & Toast) ---
function showToast(msg) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function closeModalOnBG(event, id) {
    // 長按剛開的彈窗：放開手指時若瀏覽器補發 click 落在遮罩上，不能把它關掉
    if (Date.now() - lastLongPress < 600) return;
    if(event.target.id === id) closeModal(id);
}

function showAlert(title, contentHTML) {
    document.getElementById('alertTitle').textContent = title;
    document.getElementById('alertContent').innerHTML = contentHTML;
    openModal('alertModal');
}

function showConfirm(title, content, onConfirm) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmContent').textContent = content;
    const btn = document.getElementById('confirmBtn');
    btn.onclick = () => { onConfirm(); closeModal('confirmModal'); };
    openModal('confirmModal');
}

function showPrompt(title, onConfirm) {
    document.getElementById('promptTitle').textContent = title;
    const input = document.getElementById('promptInput');
    input.value = '';
    const btn = document.getElementById('promptBtn');
    btn.onclick = () => { 
        if(input.value.trim()){ onConfirm(input.value.trim()); closeModal('promptModal'); }
    };
    openModal('promptModal');
    setTimeout(()=>input.focus(), 100);
}

function renderChangelog() {
        const listContainer = document.getElementById('changelog-list');
        if (!listContainer || typeof versionData === 'undefined') return;
    
        listContainer.innerHTML = versionData.map(item => {
            const contentList = item.changes[currentLang] || item.changes['en'];
            const listHtml = contentList.map(text => `<li>${text}</li>`).join('');
    
            return `
                <div class="version-item">
                    <div class="version-header">
                        <span class="version-tag">${item.ver}</span>
                        <span class="version-date">${item.date}</span>
                    </div>
                    <ul class="version-content">
                        ${listHtml}
                    </ul>
                </div>
            `;
        }).join('');
    }

function openFriendModal() {
    document.getElementById('friendSearch').value = '';
    renderFriendList();
    openModal('friendModal');
}

function renderFriendList() {
    const term = document.getElementById('friendSearch').value.toLowerCase();
    const container = document.getElementById('friendListContainer');
    container.innerHTML = '';
    
    let sorted = profiles.map(p => { return { ...p, aff: parseInt(localStorage.getItem(`${p.id}_affection`)) || 0 }; });
    sorted.sort((a,b) => b.aff - a.aff);
    if(term) sorted = sorted.filter(p => p.name.toLowerCase().includes(term));

    sorted.forEach(p => {
        const div = document.createElement('div');
        div.className = `friend-item ${p.id === currentProfileId ? 'active' : ''}`;
        // 名稱是使用者輸入（或匯入檔帶進來）的，一律當純文字
        const name = document.createElement('span');
        name.style.fontWeight = 'bold';
        name.textContent = p.name;
        const info = document.createElement('span');
        info.className = 'friend-item-info';
        info.textContent = `💖 ${p.aff}`;
        div.append(name, info);
        div.onclick = () => { selectProfile(p.id); closeModal('friendModal'); };
        container.appendChild(div);
    });
}

function selectProfile(id) {
    if (isPreviewMode) togglePreview(); 
    currentProfileId = id;
    localStorage.setItem('currentProfileId', currentProfileId);
    loadCurrentProfileData();
}

function promptAddProfile() {
    closeModal('friendModal');
    showPrompt(uiDict[currentLang].promptName, (name) => {
        const newId = 'friend_' + Date.now();
        profiles.push({ id: newId, name: name.slice(0, MAX_NAME_LEN) });
        localStorage.setItem('friendProfiles', JSON.stringify(profiles));
        selectProfile(newId);
        showToast(uiDict[currentLang].addedFriend);
    });
}

function confirmDeleteProfile() {
    const t = uiDict[currentLang];
    if (profiles.length <= 1) {
        showToast(t.cantDeleteLast);
        return;
    }
    closeModal('friendModal');
    showConfirm(t.delTitle, t.delConfirm, () => {
        localStorage.removeItem(`${currentProfileId}_affection`);
        items.forEach(i => localStorage.removeItem(`${currentProfileId}_${i.baseKey}`));
        profiles = profiles.filter(p => p.id !== currentProfileId);
        localStorage.setItem('friendProfiles', JSON.stringify(profiles));
        selectProfile(profiles[0].id);
        showToast(t.deleted);
    });
}

function loadCurrentProfileData() {
    const currentProfile = profiles.find(p => p.id === currentProfileId) || profiles[0];
    document.getElementById('currentFriendName').textContent = currentProfile.name;
    
    affection = parseInt(localStorage.getItem(`${currentProfileId}_affection`)) || 0;
    items.forEach(i => {
        i.unlocked = readFlag(`${currentProfileId}_${i.baseKey}`);
    });
    updateUI();
}

function saveState(){
    if (isPreviewMode) return; 
    items.forEach(i => localStorage.setItem(`${currentProfileId}_${i.baseKey}`, i.unlocked));
    localStorage.setItem(`${currentProfileId}_affection`, affection);
}

function saveMyCandles() {
    const input = document.getElementById('myCandles');
    let val = parseInt(input.value, 10);
    if (!Number.isFinite(val) || val < 0) val = 0;
    input.value = val;
    localStorage.setItem('sky_my_candles', val);
}

function addAffection(amount) {
    if (isPreviewMode) return;
    affection += amount;
    saveState();
    updateUI();
    showToast(fmt(uiDict[currentLang].affAdded, amount));
}

function confirmResetTree(){
    if (isPreviewMode) return;
    const t = uiDict[currentLang];
    showConfirm(t.resetTitle, t.resetConfirm, () => {
        items.forEach(i => i.unlocked = false);
        affection = 0;
        saveState();
        updateUI();
        showToast(t.resetDone);
    });
}

function togglePreview() {
    isPreviewMode = !isPreviewMode;
    const btn = document.getElementById('btnPreview');
    if (isPreviewMode) {
        btn.classList.add('active');
        btn.textContent = uiDict[currentLang].pvExit;
    } else {
        btn.classList.remove('active');
        btn.textContent = uiDict[currentLang].pv;
    }
    updateUI();
}

function calcTotals(){
    let totalCandleSpent = 0;
    items.forEach(i=>{ if(i.unlocked) totalCandleSpent += (parseInt(i.cst) || 0); });
    return totalCandleSpent;
}

// --- 匯出與匯入 ---
function exportData() {
    const data = { version: 1, profiles: profiles, myCandles: document.getElementById('myCandles').value, dataStore: {} };
    profiles.forEach(p => {
        data.dataStore[`${p.id}_affection`] = localStorage.getItem(`${p.id}_affection`) || 0;
        items.forEach(i => {
            let key = `${p.id}_${i.baseKey}`;
            data.dataStore[key] = localStorage.getItem(key) || "false";
        });
    });

    const blob = new Blob([JSON.stringify(data, null, 4)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sky_friends_backup.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    showToast(uiDict[currentLang].exported);
}

const MAX_IMPORT_BYTES = 1024 * 1024;
const MAX_IMPORT_PROFILES = 500;

/* 匯入檔是使用者從別處拿來的檔案，不能照單全收：
   以前會把 dataStore 裡的每個鍵原封不動寫進 localStorage，等於任何鍵都能覆蓋
   （包括其他頁面的設定，例如季節計算器的進度）。現在只接受：
     <好友id>_affection               非負整數
     <好友id>_action_<動作>_lv<等級>   "true" / "false"
   而且好友 id 必須出現在同一份檔案的 profiles 裡。其餘一律略過。 */
function sanitizeImport(data) {
    if (!data || typeof data !== 'object') return null;
    const list = cleanProfiles(data.profiles).slice(0, MAX_IMPORT_PROFILES);
    if (!list.length || !data.dataStore || typeof data.dataStore !== 'object') return null;
    const ids = new Set(list.map(p => p.id));
    const store = {};
    for (const [key, value] of Object.entries(data.dataStore)) {
        let m = key.match(/^(friend_[A-Za-z0-9_]{1,40})_affection$/);
        if (m && ids.has(m[1])) {
            const n = parseInt(value, 10);
            if (Number.isFinite(n) && n >= 0 && n <= 100000) store[key] = String(n);
            continue;
        }
        m = key.match(/^(friend_[A-Za-z0-9_]{1,40})_action_[a-z0-9]{1,40}_lv\d{1,2}$/);
        if (m && ids.has(m[1]) && (value === 'true' || value === 'false' || value === true || value === false)) {
            store[key] = String(value);
        }
    }
    const candles = parseInt(data.myCandles, 10);
    return { profiles: list, store, myCandles: Number.isFinite(candles) && candles >= 0 ? candles : 0 };
}

function importData(event) {
    const t = uiDict[currentLang];
    const file = event.target.files[0];
    event.target.value = '';                 // 同一個檔可以再選一次
    if(!file) return;
    if (file.size > MAX_IMPORT_BYTES) { showAlert(t.errTitle, escapeHtml(t.importBad)); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
        let clean;
        try { clean = sanitizeImport(JSON.parse(e.target.result)); }
        catch (err) { clean = null; }
        if (!clean) { showAlert(t.errTitle, escapeHtml(t.importBad)); return; }
        if (!Object.keys(clean.store).length) { showAlert(t.errTitle, escapeHtml(t.importEmpty)); return; }
        localStorage.setItem('friendProfiles', JSON.stringify(clean.profiles));
        localStorage.setItem('sky_my_candles', clean.myCandles);
        for (const [key, value] of Object.entries(clean.store)) {
            localStorage.setItem(key, value);
        }
        showToast(t.imported);
        setTimeout(() => location.reload(), 1000);
    };
    reader.readAsText(file);
}

// --- 渲染 UI ---
function updateProgressBar() {
    let nextTierReq = TIER_KEYS[TIER_KEYS.length - 1]; 
    let currentTierReq = 0;
    for(let i=0; i<TIER_KEYS.length; i++) {
        if(affection < TIER_KEYS[i]) { nextTierReq = TIER_KEYS[i]; currentTierReq = TIER_KEYS[i-1]; break; }
    }
    if (affection >= nextTierReq) { currentTierReq = nextTierReq; }
    let percent = 100;
    if (nextTierReq > currentTierReq) { percent = ((affection - currentTierReq) / (nextTierReq - currentTierReq)) * 100; }
    
    document.getElementById('affProgressBar').style.width = isPreviewMode ? '100%' : `${percent}%`;
    document.getElementById('affProgressText').textContent = isPreviewMode ? 'MAX' : `${affection} / ${nextTierReq}`;
}

function updateUI(){
    const t = uiDict[currentLang];
    document.getElementById('totalAffection').textContent = isPreviewMode ? "MAX" : affection;
    document.getElementById('totalCandleSpent').textContent = isPreviewMode ? "MAX" : calcTotals();
    updateProgressBar();
    
    const container = document.getElementById('treeContainer');
    container.innerHTML = '';

    const actionMaxUnlocked = {};
    items.forEach(i => {
        if (!actionMaxUnlocked[i.actionId]) actionMaxUnlocked[i.actionId] = 0;
        const isConsideredUnlocked = isPreviewMode ? true : i.unlocked;
        if (isConsideredUnlocked && i.level > actionMaxUnlocked[i.actionId]) {
            actionMaxUnlocked[i.actionId] = i.level;
        }
    });

    let visibleItems = items.filter(i => {
        if (isPreviewMode) {
            const maxLvl = Math.max(...items.filter(item => item.actionId === i.actionId).map(item => item.level));
            return i.level === maxLvl;
        }
        const currentMax = actionMaxUnlocked[i.actionId] || 0;
        return currentMax === 0 ? i.level === 1 : (i.level === currentMax || i.level === currentMax + 1);
    });

    const tierGroups = {};
    visibleItems.forEach(i => {
        if(!tierGroups[i.tier]) tierGroups[i.tier] = [];
        tierGroups[i.tier].push(i);
    });

    Object.keys(tierGroups).sort((a,b)=> a - b).forEach(tierLv => {
        const tierRow = document.createElement('div');
        tierRow.className = 'tier-row';
        
        const reqExpForTier = TIER_REQ_EXP[tierLv] || 0;
        const label = document.createElement('div');
        label.className = 'tier-label';
        label.textContent = `— Tier ${tierLv} (${t.need} ${reqExpForTier}) —`;
        tierRow.appendChild(label); 

        const sortedItems = tierGroups[tierLv].sort((a,b) => a.order - b.order);
        const chunks = [];
        for(let i = 0; i < sortedItems.length; i += 3) chunks.push(sortedItems.slice(i, i + 3));

        for(let i = chunks.length - 1; i >= 0; i--) {
            const itemsRow = document.createElement('div');
            itemsRow.className = 'items-row';
            chunks[i].forEach(item => {
                const itemDiv = createItemDiv(item, actionMaxUnlocked[item.actionId], t);
                itemsRow.appendChild(itemDiv);
            });
            tierRow.appendChild(itemsRow);
        }
        container.appendChild(tierRow);
    });
}

const PLACEHOLDER_IMG = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MCIgaGVpZ2h0PSI1MCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iI2RkZCIvPjxwYXRoIGQ9Ik0yNSAxNWwtMTAgMTBoMjB6IiBmaWxsPSIjOTk5Ii8+PC9zdmc+';

function createItemDiv(item, currentMaxLevel, t){
    const div = document.createElement('div');
    const isVisuallyUnlocked = isPreviewMode ? true : item.unlocked;
    div.className = `item ${isVisuallyUnlocked ? 'unlocked' : 'locked'}`;
    const requiredAffection = TIER_REQ_EXP[item.tier] || 0;

    // 一律用 DOM 組，不把資料字串拼進 innerHTML
    const badge = document.createElement('div');
    badge.className = 'item-badge';
    badge.textContent = isVisuallyUnlocked ? `✅ Lv.${item.level}` : `🕯️ ${item.cst}`;

    const img = document.createElement('img');
    img.alt = item.nm;
    img.loading = 'lazy';
    img.addEventListener('error', () => { if (img.src !== PLACEHOLDER_IMG) img.src = PLACEHOLDER_IMG; });
    img.src = item.image || PLACEHOLDER_IMG;

    const name = document.createElement('div');
    name.className = 'item-name';
    name.textContent = item.nm;

    div.append(badge, img, name);

    // 點擊解鎖 (嚴格順序)
    div.addEventListener('click', ()=>{
        if (isPreviewMode) return;
        if (suppressClick) { suppressClick = false; return; }   // 長按剛結束
        if(!item.unlocked) {
            if(item.level === currentMaxLevel + 1) {
                if (affection >= requiredAffection) {
                    item.unlocked = true;
                    affection += expOf(item);
                    saveState();
                    updateUI();

                    // 播放解鎖特效
                    const activeCards = document.querySelectorAll('.item.unlocked');
                    const lastCard = activeCards[activeCards.length-1];
                    if(lastCard){
                        lastCard.classList.add('animating');
                        setTimeout(() => lastCard.classList.remove('animating'), 400);
                    }
                } else {
                    showAlert('⚠️ ' + t.noAff, fmt(t.needAffBody, item.tier, requiredAffection, affection));
                }
            } else {
                showAlert(t.warnTitle, escapeHtml(t.errOrd));
            }
        } else {
            // 同一動作比它高的等級也要一起取消，不然會留下「Lv.3 已解、Lv.2 未解」的狀態，
            // 蠟燭照算、畫面卻看不到 Lv.3
            const chain = items.filter(i => i.actionId === item.actionId && i.level >= item.level && i.unlocked)
                               .sort((a, b) => a.level - b.level);
            const higher = chain.filter(i => i !== item).map(i => `Lv.${i.level}`);
            const msg = higher.length ? fmt(t.cancelChain, item.nm, higher.join(', '))
                                      : fmt(t.cancelUnlock, item.nm);
            showConfirm(t.cancelTitle, msg, () => {
                chain.forEach(i => { i.unlocked = false; affection -= expOf(i); });
                if(affection < 0) affection = 0;
                saveState();
                updateUI();
            });
        }
    });

    // 右鍵 / 手機長按 計算目標
    const onContext = () => {
        if (isPreviewMode || item.unlocked) return;

        let costCandles = 0;
        let levelsToUnlock = [];
        items.forEach(i => {
            if (i.actionId === item.actionId && i.level <= item.level && !i.unlocked) {
                costCandles += parseInt(i.cst) || 0;
                levelsToUnlock.push(`Lv.${i.level}`);
            }
        });

        const diffAffection = Math.max(0, requiredAffection - affection);
        const myC = parseInt(document.getElementById('myCandles').value) || 0;
        const candleStatus = myC >= costCandles ? `<span style="color:var(--success-color);font-weight:bold;">${t.c_enough} (${myC - costCandles})</span>` : `<span style="color:var(--danger-color);font-weight:bold;">${t.c_short} (${costCandles - myC})</span>`;

        // 根據差額決定顯示「還差 N」或是「已達標」
        const diffText = diffAffection > 0
            ? t.t_diff.replace('{0}', `<span style="color:var(--danger-color)">${diffAffection}</span>`)
            : t.t_met;

        const html = `
            <b>【${escapeHtml(item.nm)} Lv.${item.level}】</b><br><br>
            👉 ${t.t_lv}${levelsToUnlock.join(', ')}<br>
            🕯️ ${t.t_can}<b style="font-size:16px;">${costCandles}</b><br>
            📦 ${t.t_inv}${candleStatus}<br><br>
            💖 ${t.t_aff}${requiredAffection} ${diffText}
        `;
        showAlert(t.target, html);
    };

    // 桌機右鍵。手機長按時 Android 也會發 contextmenu —— 長按已經處理過就略過，免得開兩次
    div.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (Date.now() - lastLongPress < 800) return;
        onContext();
    });

    // 手機長按 (0.5 秒)。
    // 舊寫法的問題：放開手指時瀏覽器會補發一次 click，而那時彈窗已經蓋在手指底下，
    // click 落在遮罩上 -> 彈窗立刻被關掉；沒蓋到時則會誤觸解鎖。
    // 所以長按成立後，在 touchend 取消那次合成的 click。
    let touchTimer = null, longPressed = false;
    div.addEventListener('touchstart', () => {
        longPressed = false;
        touchTimer = setTimeout(() => { longPressed = true; lastLongPress = Date.now(); onContext(); }, 500);
    }, {passive: true});
    div.addEventListener('touchend', (e) => {
        clearTimeout(touchTimer);
        if (longPressed) { e.preventDefault(); suppressClick = true; setTimeout(() => { suppressClick = false; }, 400); }
    });
    div.addEventListener('touchmove', () => { clearTimeout(touchTimer); }, {passive: true});
    div.addEventListener('touchcancel', () => { clearTimeout(touchTimer); });

    return div;
}

initApp();
</script>
